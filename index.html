<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Sivaa ✨</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: Georgia, serif;
            background:
                radial-gradient(circle at 50% 45%, #34205c 0%, #17102d 40%, #080612 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Stars */
        .stars {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {
            from {
                opacity: 0.2;
                transform: scale(0.7);
            }
            to {
                opacity: 1;
                transform: scale(1.4);
            }
        }

        /* Main content */
        .container {
            text-align: center;
            position: relative;
            z-index: 2;
            padding: 25px;
        }

        .small-text {
            font-size: 18px;
            letter-spacing: 3px;
            opacity: 0.85;
            margin-bottom: 25px;
        }

        .name {
            font-size: clamp(55px, 14vw, 110px);
            letter-spacing: 12px;
            margin-bottom: 5px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #e8c8ff,
                #ffffff
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            text-shadow: 0 0 30px rgba(220, 180, 255, 0.5);
        }

        .age {
            font-size: 28px;
            letter-spacing: 6px;
            color: #e5c6ff;
            margin-bottom: 25px;
        }

        .message {
            max-width: 500px;
            margin: auto;
            font-size: 18px;
            line-height: 1.7;
            color: #ddd3eb;
            font-style: italic;
        }

        /* Countdown */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 35px 0;
        }

        .time-box {
            min-width: 65px;
            padding: 12px 8px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);
        }

        .number {
            display: block;
            font-size: 25px;
            color: white;
        }

        .label {
            font-size: 10px;
            letter-spacing: 2px;
            color: #cdb6df;
        }

        /* Button */
        .magic-button {
            display: inline-block;
            padding: 15px 32px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            text-decoration: none;
            letter-spacing: 2px;
            background: rgba(255,255,255,0.08);
            transition: 0.4s;
            box-shadow: 0 0 20px rgba(205,160,255,0.15);
        }

        .magic-button:hover {
            transform: translateY(-4px);
            background: rgba(220,180,255,0.2);
            box-shadow: 0 0 35px rgba(205,160,255,0.4);
        }

        /* Floating sparkle */
        .sparkle {
            position: absolute;
            font-size: 20px;
            animation: float 5s infinite ease-in-out;
            opacity: 0.7;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-25px);
            }
        }

        @media (max-width: 600px) {
            .small-text {
                font-size: 14px;
            }

            .name {
                letter-spacing: 7px;
            }

            .message {
                font-size: 16px;
            }

            .countdown {
                gap: 7px;
            }

            .time-box {
                min-width: 58px;
            }
        }
    </style>
</head>

<body>

    <div class="stars" id="stars"></div>

    <div class="sparkle" style="top:15%; left:15%;">✦</div>
    <div class="sparkle" style="top:25%; right:15%; animation-delay:1s;">✧</div>
    <div class="sparkle" style="bottom:18%; left:20%; animation-delay:2s;">✦</div>
    <div class="sparkle" style="bottom:25%; right:20%; animation-delay:3s;">✧</div>

    <main class="container">

        <div class="small-text">
            ✦ A little magic, just for you ✦
        </div>

        <h1 class="name">SIVAA</h1>

        <div class="age">
            20 ✨
        </div>

        <p class="message">
            Some people enter our lives quietly,
            and somehow become one of the most
            beautiful parts of our story.
        </p>

        <div class="countdown">

            <div class="time-box">
                <span class="number" id="days">00</span>
                <span class="label">DAYS</span>
            </div>

            <div class="time-box">
                <span class="number" id="hours">00</span>
                <span class="label">HOURS</span>
            </div>

            <div class="time-box">
                <span class="number" id="minutes">00</span>
                <span class="label">MINUTES</span>
            </div>

            <div class="time-box">
                <span class="number" id="seconds">00</span>
                <span class="label">SECONDS</span>
            </div>

        </div>

        <a href="story.html" class="magic-button">
            Enter the Magic ✨
        </a>

    </main>

    <script>

        /* Create stars */
        const starsContainer = document.getElementById("stars");

        for (let i = 0; i < 100; i++) {

            const star = document.createElement("div");

            star.className = "star";

            star.style.left = Math.random() * 100 + "%";
            star.style.top = Math.random() * 100 + "%";

            star.style.animationDelay =
                Math.random() * 3 + "s";

            starsContainer.appendChild(star);
        }


        /* Birthday countdown */

        function updateCountdown() {

            const now = new Date();

            let birthday =
                new Date(now.getFullYear(), 9, 3);

            /*
              October = month 9
              because JavaScript months start from 0
            */

            if (now > birthday) {
                birthday =
                    new Date(now.getFullYear() + 1, 9, 3);
            }

            const difference =
                birthday - now;

            const days =
                Math.floor(difference / (1000 * 60 * 60 * 24));

            const hours =
                Math.floor(
                    (difference / (1000 * 60 * 60)) % 24
                );

            const minutes =
                Math.floor(
                    (difference / (1000 * 60)) % 60
                );

            const seconds =
                Math.floor(
                    (difference / 1000) % 60
                );

            document.getElementById("days").textContent =
                String(days).padStart(2, "0");

            document.getElementById("hours").textContent =
                String(hours).padStart(2, "0");

            document.getElementById("minutes").textContent =
                String(minutes).padStart(2, "0");

            document.getElementById("seconds").textContent =
                String(seconds).padStart(2, "0");
        }

        updateCountdown();

        setInterval(updateCountdown, 1000);

    </script>

</body>
</html>
